# 服务器部署编排：PostgreSQL(pgvector) + API + worker
#
# 用法（在仓库根目录）：
#   docker compose -f deploy/compose.server.yml up -d --build
#   docker compose -f deploy/compose.server.yml exec api python db/migrate.py --apply
#   docker compose -f deploy/compose.server.yml logs -f api worker
#
# 设计取舍：
#   * 数据库用 pgvector/pgvector:pg16 镜像，pgvector 扩展天然可用（0001 迁移要用）。
#   * 端口只绑 127.0.0.1：API 交给 nginx 反代，数据库不对外。
#   * 代码 bind mount 进容器：改代码只需重启容器，不用重建镜像。
#   * DATABASE_URL 用 compose 里的服务名 db（不是 127.0.0.1），并显式覆盖 .env，
#     避免把宿主机地址带进容器。
#   * worker 与 api 共用同一镜像，只是命令不同——它们必须用同一份代码与同一套依赖，
#     否则"求解在 api 里能跑、在 worker 里跑不了"这种问题排查起来极痛苦。

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mathagent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mathagent}
      # 中文全文检索需要合适的排序规则；建库时指定，建好再改要重新导入
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mathagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathagent} -d ${POSTGRES_DB:-mathagent}"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    image: mathagent-runtime:latest
    container_name: mathagent-api
    restart: unless-stopped
    working_dir: /srv/mathagent
    volumes:
      - ..:/srv/mathagent
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathagent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mathagent}
      APP_ENV: ${APP_ENV:-dev}
      AUTH_MODE: ${AUTH_MODE:-dev}
      AUTH_DEV_ROLES: ${AUTH_DEV_ROLES:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8000}
      SECRETS_DIR: ${SECRETS_DIR:-./secrets}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    image: mathagent-runtime:latest
    container_name: mathagent-worker
    restart: unless-stopped
    working_dir: /srv/mathagent
    volumes:
      - ..:/srv/mathagent
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mathagent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mathagent}
      APP_ENV: ${APP_ENV:-dev}
      AUTH_MODE: ${AUTH_MODE:-dev}
    command: ["python", "scripts/run_worker.py"]
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

volumes:
  mathagent-pgdata:

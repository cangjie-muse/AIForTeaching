services:
  db:
    image: pgvector/pgvector:pg16
    container_name: whu-teaching-db
    environment:
      POSTGRES_USER: whu
      POSTGRES_PASSWORD: whu_dev_password
      POSTGRES_DB: whu_teaching
      # 中文全文检索需要合适的排序规则；建库时指定，建好再改要重导
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whu -d whu_teaching"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./server
    container_name: whu-teaching-api
    environment:
      DATABASE_URL: postgresql://whu:whu_dev_password@db:5432/whu_teaching
      CORS_ORIGINS: http://127.0.0.1:8765,http://localhost:8765
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
